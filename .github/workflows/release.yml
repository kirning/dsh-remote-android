name: Release

# 触发条件：
#   - 推送 tag（v1.2.3）→ 发布正式 Release
#   - 推送到 main 分支 → 只构建 APK，不发 Release（用于验证构建是否正常）
#   - 手动触发 → 手动指定版本号发布
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.3，不带 v 前缀）'
        required: true
        type: string
      publish:
        description: '是否创建 GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.8'
  JAVA_VERSION: '17'

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.pub-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # 签名密钥来自仓库 Secrets，本地 key.properties 不入库。
      # 未配置 secret 时会自动退回 debug 签名，保证 CI 仍能跑通。
      - name: 写入签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次使用 debug 签名构建。"
            echo "::warning::正式发布请在仓库 Settings → Secrets and variables → Actions 中添加。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/dsh-harness-release.jks
          cat > android/key.properties <<EOF
          storeFile=dsh-harness-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "签名配置已写入"

      - name: 确定版本号
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          fi
          VERSION_CODE=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+[[:space:]]*//')
          # 构建号必须严格递增：run 号 * 100 + pubspec 里的基础号
          BUILD_NUMBER=$(( ${GITHUB_RUN_NUMBER} * 100 + ${VERSION_CODE} ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "构建版本 $VERSION (code $BUILD_NUMBER)"

      - name: 拉取依赖
        run: flutter pub get

      - name: 运行静态检查
        run: flutter analyze --no-fatal-infos

      - name: 运行单元测试
        run: flutter test

      - name: 构建 Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.version_code }}" \
            --dart-define=UPDATE_REPO=${{ github.repository }}

      - name: 整理产物
        id: artifact
        env:
          REL_VERSION: ${{ steps.version.outputs.version }}
          REL_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          REL_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/dsh-harness.apk

          SIZE=$(stat -c%s dist/dsh-harness.apk)
          SHA=$(sha256sum dist/dsh-harness.apk | cut -d' ' -f1)
          PUBLISHED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # 更新日志：优先用 .github/RELEASE_NOTES.md，否则用本次构建的提交信息。
          if [ -f .github/RELEASE_NOTES.md ]; then
            cp .github/RELEASE_NOTES.md dist/notes.txt
          else
            git log --pretty=format:'- %s' -n 10 > dist/notes.txt
          fi

          {
            echo "size=$SIZE"
            echo "sha256=$SHA"
            echo "published_at=$PUBLISHED"
          } >> "$GITHUB_OUTPUT"

          # 生成 version.json（供自建服务器的静态清单方案使用）。
          # 注意：sha/size 等要在这里用 shell 变量直接传给 Python，
          # 不能依赖本 step 自己的 outputs（step 无法引用自己的 outputs）。
          REL_SIZE="$SIZE" REL_SHA="$SHA" REL_PUBLISHED="$PUBLISHED" \
            python3 - <<'PY'
          import json, os
          version = os.environ['REL_VERSION']
          version_code = int(os.environ['REL_VERSION_CODE'])
          sha = os.environ['REL_SHA']
          published = os.environ['REL_PUBLISHED']
          size = int(os.environ['REL_SIZE'])
          repo = os.environ['REL_REPO']

          notes = [l.lstrip('- ').strip()
                   for l in open('dist/notes.txt', encoding='utf-8') if l.strip()]

          data = {
              "version": version,
              "versionCode": version_code,
              "downloadUrl": f"https://github.com/{repo}/releases/latest/download/dsh-harness.apk",
              "sha256": sha,
              "sizeBytes": size,
              "publishedAt": published,
              "minAndroidVersion": "7.0",
              "notes": notes,
          }
          json.dump(data, open('dist/version.json', 'w', encoding='utf-8'),
                    ensure_ascii=False, indent=2)
          PY

          {
            echo "size=$SIZE"
            echo "sha256=$SHA"
            echo "published_at=$PUBLISHED"
          } >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-harness-apk
          path: |
            dist/dsh-harness.apk
            dist/version.json
          retention-days: 30

      - name: 创建 GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: v${{ steps.version.outputs.version }}
          REL_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # gh CLI 预装在 GitHub runner 上；这里显式确认并用 token 登录。
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::runner 上没有 gh CLI"
            exit 1
          fi
          gh --version
          echo "$GH_TOKEN" | gh auth login --hostname github.com --with-token

          # ---- 组装 Release body ----
          # 结构化元信息放在 HTML 注释里，供 App 解析版本号与更新日志，
          # 同时不影响正文的可读性。
          #
          # 直接复用上一步生成的 version.json，保证 Release 与清单数据一致。
          #
          # 注意：Python 脚本必须用 YAML 块标量（|）包裹，
          # 否则其中的 '- 开头的行会被 YAML 当成列表项解析而报错。
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('dist/version.json', encoding='utf-8'))
          version = manifest['version']
          version_code = manifest['versionCode']
          size = manifest['sizeBytes']
          sha = manifest['sha256']
          published = manifest['publishedAt']
          tag = os.environ['REL_TAG']
          notes = manifest.get('notes', [])

          # 用列表逐行拼装，避免多行字符串破坏 YAML 块标量的缩进。
          lines = [
              f'## DSH Harness v{version}',
              '',
              f'- 版本号：{version}',
              f'- 构建号：{version_code}',
              f'- 文件大小：{size // 1048576} MB',
              '- 最低系统：Android 7.0 (API 24)',
              f'- 发布时间：{published}',
              '',
              '### 下载',
              '',
              f'APK 文件名：`dsh-harness.apk`　sha256：`{sha}`',
              '',
              '### 更新内容',
              '',
          ]
          lines += ['- ' + n for n in notes]
          lines += [
              '',
              f'<!-- versionCode={version_code} -->',
              '<!-- minAndroidVersion=7.0 -->',
              '<!-- notes -->',
          ]
          lines += ['- ' + n for n in notes]
          lines += ['<!-- /notes -->', '']
          body = '\n'.join(lines)

          json.dump({
              'tag_name': tag,
              'name': f'DSH Harness v{version}',
              'body': body,
              'draft': False,
              'prerelease': False,
          }, open('release.json', 'w', encoding='utf-8'), ensure_ascii=False)
          PY

          # 顺便把同样的内容写进 job summary，方便在 Actions 页面直接看。
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          print(json.load(open('release.json', encoding='utf-8'))['body'])
          PY

          # ---- 创建 Release（已存在则复用，保证重跑幂等）----
          echo "--- 创建 Release ---"
          HTTP_CODE=$(curl -sS -w '%{http_code}' -o release_resp.json \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REL_REPO}/releases" \
            --data @release.json)

          if [ "$HTTP_CODE" = "201" ]; then
            echo "Release 已创建"
          elif [ "$HTTP_CODE" = "422" ]; then
            # 该 tag 的 Release 已存在（重跑场景），改用 PATCH 更新。
            echo "Release 已存在，改为更新"
            EXISTING_ID=$(curl -sS --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REL_REPO}/releases/tags/${REL_TAG}" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
            curl -sS -o /dev/null -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${REL_REPO}/releases/$EXISTING_ID" \
              --data @release.json
            release_resp.json=$(curl -sS --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REL_REPO}/releases/tags/${REL_TAG}")
          else
            echo "::error::创建 Release 失败（HTTP $HTTP_CODE）"
            cat release_resp.json
            exit 1
          fi

          RELEASE_ID=$(python3 -c "import json;print(json.load(open('release_resp.json'))['id'])")
          UPLOAD_URL=$(python3 -c "import json;print(json.load(open('release_resp.json'))['upload_url'])")
          export UPLOAD_URL
          echo "Release id=$RELEASE_ID"

          # ---- 上传 APK 资产 ----
          # 用 gh CLI 上传：它内部对 multipart 与大文件分块的处理是正确的，
          # 手写 curl -F 容易踩到 "Bad Size"(422) 与
          # "Multipart form data required"(400) 这两个坑。
          echo "--- 上传 APK 资产 ---"

          # 上传前先删掉同名旧资产，保证重跑能覆盖。
          ASSET_ID=$(python3 - <<'PYEOF'
          import json, os, urllib.request
          url = os.environ['UPLOAD_URL'].split('{')[0]
          req = urllib.request.Request(
              url + '?per_page=100',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
          try:
              data = json.load(urllib.request.urlopen(req))
          except Exception:
              data = []
          for a in data:
              if a.get('name') == 'dsh-harness.apk':
                  print(a['id'])
                  break
          PYEOF
          )
          if [ -n "$ASSET_ID" ]; then
            echo "删除已存在的资产 id=$ASSET_ID"
            curl -sS -o /dev/null -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REL_REPO}/releases/assets/$ASSET_ID"
          fi

          gh release upload "${REL_TAG}" dist/dsh-harness.apk#dsh-harness.apk \
            --repo "${REL_REPO}" --clobber
          echo "APK 上传完成"
          echo "Release 已发布：https://github.com/${REL_REPO}/releases/tag/${REL_TAG}"
