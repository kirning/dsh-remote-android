name: Release

# 触发条件：
#   - 推送 tag（v1.2.3）→ 发布正式 Release
#   - 推送到 main 分支 → 只构建 APK，不发 Release（用于验证构建是否正常）
#   - 手动触发 → 手动指定版本号发布
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.3，不带 v 前缀）'
        required: true
        type: string
      publish:
        description: '是否创建 GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.8'
  JAVA_VERSION: '17'

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.pub-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # 签名密钥来自仓库 Secrets，本地 key.properties 不入库。
      # 未配置 secret 时会自动退回 debug 签名，保证 CI 仍能跑通。
      - name: 写入签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次使用 debug 签名构建。"
            echo "::warning::正式发布请在仓库 Settings → Secrets and variables → Actions 中添加。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/dsh-harness-release.jks
          cat > android/key.properties <<EOF
          storeFile=dsh-harness-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "签名配置已写入"

      - name: 确定版本号
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          fi
          VERSION_CODE=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+[[:space:]]*//')
          # 构建号必须严格递增：run 号 * 100 + pubspec 里的基础号
          BUILD_NUMBER=$(( ${GITHUB_RUN_NUMBER} * 100 + ${VERSION_CODE} ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "构建版本 $VERSION (code $BUILD_NUMBER)"

      - name: 拉取依赖
        run: flutter pub get

      - name: 运行静态检查
        run: flutter analyze --no-fatal-infos

      - name: 运行单元测试
        run: flutter test

      - name: 构建 Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.version_code }}" \
            --dart-define=UPDATE_REPO=${{ github.repository }}

      - name: 整理产物
        id: artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/dsh-harness.apk

          SIZE=$(stat -c%s dist/dsh-harness.apk)
          SHA=$(sha256sum dist/dsh-harness.apk | cut -d' ' -f1)
          PUBLISHED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # 更新日志：优先用 .github/RELEASE_NOTES.md，否则用本次构建的提交信息。
          if [ -f .github/RELEASE_NOTES.md ]; then
            cp .github/RELEASE_NOTES.md dist/notes.txt
          else
            git log --pretty=format:'- %s' -n 10 > dist/notes.txt
          fi

          # 生成 version.json（供自建服务器的静态清单方案使用）
          python3 - <<PY
          import json
          notes = [l.lstrip('- ').strip() for l in open('dist/notes.txt', encoding='utf-8') if l.strip()]
          data = {
            "version": "${{ steps.version.outputs.version }}",
            "versionCode": ${{ steps.version.outputs.version_code }},
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/latest/download/dsh-harness.apk",
            "sha256": "$SHA",
            "sizeBytes": $SIZE,
            "publishedAt": "$PUBLISHED",
            "minAndroidVersion": "7.0",
            "notes": notes,
          }
          json.dump(data, open('dist/version.json', 'w', encoding='utf-8'),
                    ensure_ascii=False, indent=2)
          PY

          {
            echo "size=$SIZE"
            echo "sha256=$SHA"
            echo "published_at=$PUBLISHED"
          } >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-harness-apk
          path: |
            dist/dsh-harness.apk
            dist/version.json
          retention-days: 30

      - name: 创建 GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          SIZE: ${{ steps.artifact.outputs.size }}
          SHA: ${{ steps.artifact.outputs.sha256 }}
          PUBLISHED: ${{ steps.artifact.outputs.published_at }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # ---- 组装 Release body ----
          # 结构化元信息放在 HTML 注释里，供 App 解析版本号与更新日志，
          # 同时不影响正文的可读性。
          NOTES_BLOCK=$(sed 's/^/> /' dist/notes.txt)

          {
            echo "## DSH Harness v${VERSION}"
            echo
            echo "- 版本号：${VERSION}"
            echo "- 构建号：${VERSION_CODE}"
            echo "- 文件大小：$(( SIZE / 1048576 )) MB"
            echo "- 最低系统：Android 7.0 (API 24)"
            echo "- 发布时间：${PUBLISHED}"
            echo
            echo "### 下载"
            echo
            echo "APK 文件名：\`dsh-harness.apk\`　sha256：\`${SHA}\`"
            echo
            echo "### 更新内容"
            echo
            echo "${NOTES_BLOCK}"
          } >> "$GITHUB_STEP_SUMMARY"

          python3 - <<PY
          import json, os
          notes = [l.lstrip('- ').strip() for l in open('dist/notes.txt', encoding='utf-8') if l.strip()]
          body = f"""## DSH Harness v${VERSION}

- 版本号：${VERSION}
- 构建号：${VERSION_CODE}
- 文件大小：$(( SIZE / 1048576 )) MB
- 最低系统：Android 7.0 (API 24)

### 下载

APK 文件名：\`dsh-harness.apk\`　sha256：\`${SHA}\`

### 更新内容

{chr(10).join('- ' + n for n in notes)}

<!-- versionCode=${VERSION_CODE} -->
<!-- minAndroidVersion=7.0 -->
<!-- notes -->
{chr(10).join('- ' + n for n in notes)}
<!-- /notes -->
"""
          json.dump({
              "tag_name": "${TAG}",
              "name": "DSH Harness v${VERSION}",
              "body": body,
              "draft": False,
              "prerelease": False,
          }, open('release.json', 'w', encoding='utf-8'), ensure_ascii=False)
          PY

          # ---- 用 curl 调 API 创建 Release ----
          # 不依赖 gh CLI，行为更可预期。
          echo "--- 创建 Release ---"
          HTTP_CODE=$(curl -sS -w '%{http_code}' -o release_resp.json \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/releases" \
            --data @release.json)

          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::创建 Release 失败（HTTP $HTTP_CODE）"
            cat release_resp.json
            exit 1
          fi

          RELEASE_ID=$(python3 -c "import json;print(json.load(open('release_resp.json'))['id'])")
          UPLOAD_URL=$(python3 -c "import json;print(json.load(open('release_resp.json'))['upload_url'])")
          echo "Release 已创建，id=$RELEASE_ID"

          # ---- 上传 APK 资产 ----
          echo "--- 上传 APK 资产 ---"
          HTTP_CODE=$(curl -sS -w '%{http_code}' -o upload_resp.json \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/octet-stream" \
            "${UPLOAD_URL}?name=dsh-harness.apk" \
            --data-binary @dist/dsh-harness.apk)

          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::上传 APK 失败（HTTP $HTTP_CODE）"
            cat upload_resp.json
            exit 1
          fi

          echo "APK 上传完成"
          echo "Release 已发布：https://github.com/${REPO}/releases/tag/${TAG}"
